name: FOSI - Update scouting data
on:
  workflow_dispatch:
    inputs:
      country: {description: 'Country', required: true, default: 'Poland'}
      competition: {description: 'Competition', required: true, default: 'Ekstraklasa'}
      team: {description: 'Team', required: true, default: 'Pogoń Szczecin'}
  push:
    paths: ['collectors/**','engine/**','config/**','.github/workflows/update-data.yml']
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply requested scouting target only for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FOSI_COUNTRY: ${{ inputs.country }}
          FOSI_COMPETITION: ${{ inputs.competition }}
          FOSI_TEAM: ${{ inputs.team }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path('config/selected-scout.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          country=os.environ['FOSI_COUNTRY']; competition=os.environ['FOSI_COMPETITION']; team=os.environ['FOSI_TEAM']
          slug=re.sub(r'[^a-z0-9]+','-',team.lower()).strip('-')
          d.update({'enabled':True,'country':country,'competition':competition,'team':team,'team_id':slug})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run selected-target acquisition
        run: python engine/run_scout.py
      - name: Build RAW field dictionary
        run: python engine/build_data_dictionary.py
      - name: Build normalized FOSI data layer
        run: python engine/normalize_sources.py
      - name: Test FOSI normalization
        working-directory: engine
        run: python -m unittest test_normalize_sources.py -v
      - name: Test FOSI metrics engine
        working-directory: engine
        run: python -m unittest test_metrics_engine.py -v
      - name: Build FOSI metrics
        run: python engine/metrics_engine.py
      - name: Build spatial evidence index
        run: python engine/spatial.py
      - name: Publish dashboard payload
        run: python engine/publish_dashboard.py
      - name: Validate dashboard payload
        run: python engine/validate_dashboard.py
      - name: Commit updated data
        run: |
          git config user.name 'fosi-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scouting/ data/fosi-data-dictionary.json dashboard/data.json
          git diff --cached --quiet || git commit -m 'data: update active scouting dataset'
          git push
