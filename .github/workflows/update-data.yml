name: FOSI - Update scouting data

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country'
        required: true
        default: 'Poland'
      competition:
        description: 'Competition'
        required: true
        default: 'Ekstraklasa'
      team:
        description: 'Team'
        required: true
        default: 'Pogoń Szczecin'
  push:
    paths:
      - 'collectors/**'
      - 'engine/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

env:
  FOSI_COUNTRY: ${{ inputs.country || 'Poland' }}
  FOSI_COMPETITION: ${{ inputs.competition || 'Ekstraklasa' }}
  FOSI_TEAM: ${{ inputs.team || 'Pogoń Szczecin' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FOSI scouting pipeline
        run: python engine/run_scout.py
      - name: Publish dashboard payload
        run: python engine/publish_dashboard.py
      - name: Validate dashboard payload
        run: python engine/validate_dashboard.py
      - name: Commit updated scouting data and dashboard payload
        run: |
          git config user.name 'fosi-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scouting/ dashboard/data.json
          git diff --cached --quiet || git commit -m 'data: update scouting dataset and dashboard'
          git push
